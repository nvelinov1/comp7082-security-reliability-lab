name: tests

on:
  pull_request:
  push:

jobs:
  check:
    name: run tests
    runs-on: ubuntu-latest
  
    steps:
      - uses: actions/checkout@v7

      - name: Install Dependencies
        run: python3 -m pip install -r requirements.txt
      
      - name: Run tests
        run: python3 -m pytest -q